<!DOCTYPE html>
<!-- The test chooses the CSS of the canvas and of what is around it. -->
<html>
<head><meta charset="UTF-8"></head>
<body style="margin: 0">
  <div id="wrapper"><canvas id="game"></canvas></div>
  <input id="field">
  <script type="module">
    import { {{MAIN_CLASS}} } from "./{{JS_PATH}}";
    const params = new URLSearchParams(location.search);
    document.getElementById("wrapper").style.cssText = params.get("wrapper") ?? "";
    document.getElementById("game").style.cssText = params.get("canvas") ?? "";
    {{MAIN_CLASS}}.run(document.getElementById("game"));
  </script>
</body>
</html>
