name: Website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "bazel/scaladoc/**"
      - "core/src/main/**"
      - "engines/**/src/main/**"
      - "modules/**/src/main/**"
      - "extensions/**/src/main/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [master]
    paths:
      - "website/**"
      - "bazel/scaladoc/**"
      - "core/src/main/**"
      - "engines/**/src/main/**"
      - "modules/**/src/main/**"
      - "extensions/**/src/main/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The docs show each page's last update, read from the git history.
          fetch-depth: 0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build Scaladoc
        working-directory: .
        run: bazel build //website:scaladoc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Copy Scaladoc into site output
        working-directory: .
        run: |
          if [ -d website/dist/api ]; then chmod -R u+w website/dist/api && rm -rf website/dist/api; fi
          cp -rL bazel-bin/website/scaladoc website/dist/api
          chmod -R u+w website/dist/api

      # master deploys to production; other branches get a preview URL.
      # Pull requests from forks have no access to the secrets and skip this.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=libsgl --branch=${{ github.head_ref || github.ref_name }}
          workingDirectory: website
