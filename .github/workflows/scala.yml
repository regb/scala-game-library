name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Check formatting
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=off -r .

      - name: Lint Bazel files
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn -r .

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libglu1-mesa-dev libsdl2-dev libsdl2-image-dev

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...
